name: Deploy visual project gallery

on:
  push:
    branches: [main]
    paths:
      - "hardware/visualization/project-gallery.html"
      - ".github/workflows/deploy-visual-gallery.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package visual gallery
        uses: actions/upload-pages-artifact@v3
        with:
          path: hardware/visualization
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
