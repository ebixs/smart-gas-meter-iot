name: Hardware CAD checks

on:
  push:
    paths:
      - "hardware/kicad/**"
      - ".github/workflows/hardware-cad-check.yml"
  pull_request:
    paths:
      - "hardware/kicad/**"
      - ".github/workflows/hardware-cad-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cad-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect native KiCad project
        id: detect
        shell: bash
        run: |
          if find hardware/kicad -maxdepth 1 -type f \( -name '*.kicad_sch' -o -name '*.kicad_pcb' \) 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check native schematic structure
        if: steps.detect.outputs.present == 'true'
        run: python3 hardware/kicad/check_schematic_structure.py
      - name: Install KiCad 9 CLI
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends kicad
      - name: Run ERC, DRC and exports
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -uo pipefail
          kicad-cli version
          mkdir -p /tmp/schematic-preview /tmp/netlists /tmp/gerbers /tmp/drill /tmp/cad-reports
          failed=0
          while IFS= read -r -d '' file; do
            base="$(basename "$file" .kicad_sch)"
            echo "Running ERC: $file"
            if kicad-cli sch erc --exit-code-violations --output "/tmp/cad-reports/$base-erc.rpt" "$file"; then
              echo "ERC passed: $file"
            else
              rc=$?
              echo "ERC failed (exit $rc): $file"
              failed=1
            fi
            if ! kicad-cli sch export svg "$file" --output "/tmp/schematic-preview/"; then
              echo "Schematic SVG export failed: $file"
              failed=1
            fi
            if ! kicad-cli sch export netlist "$file" --output "/tmp/netlists/$base.net"; then
              echo "Netlist export failed: $file"
              failed=1
            fi
          done < <(find hardware/kicad -maxdepth 1 -type f -name '*.kicad_sch' -print0)
          while IFS= read -r -d '' file; do
            base="$(basename "$file" .kicad_pcb)"
            echo "Running DRC: $file"
            if kicad-cli pcb drc --exit-code-violations --output "/tmp/cad-reports/$base-drc.rpt" "$file"; then
              echo "DRC passed: $file"
            else
              rc=$?
              echo "DRC failed (exit $rc): $file"
              failed=1
            fi
            if ! kicad-cli pcb export gerbers "$file" --output "/tmp/gerbers/"; then
              echo "Gerber export failed: $file"
              failed=1
            fi
            if ! kicad-cli pcb export drill "$file" --output "/tmp/drill/"; then
              echo "Drill export failed: $file"
              failed=1
            fi
          done < <(find hardware/kicad -maxdepth 1 -type f -name '*.kicad_pcb' -print0)
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more CAD checks failed. Review the uploaded reports; this workflow does not suppress ERC/DRC violations."
            exit 1
          fi
      - name: Upload CAD reports and exports
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kicad-validation-${{ github.run_id }}
          path: |
            /tmp/cad-reports/
            /tmp/schematic-preview/
            /tmp/netlists/
            /tmp/gerbers/
            /tmp/drill/
          if-no-files-found: warn
      - name: Report CAD status
        if: steps.detect.outputs.present != 'true'
        run: echo "::warning::No native KiCad schematic/PCB files exist yet. Documentation and draft netlist are not manufacturing CAD."
