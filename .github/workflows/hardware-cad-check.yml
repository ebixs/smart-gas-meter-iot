name: Hardware CAD checks

on:
  push:
    paths:
      - "hardware/kicad/**"
      - ".github/workflows/hardware-cad-check.yml"
  pull_request:
    paths:
      - "hardware/kicad/**"
      - ".github/workflows/hardware-cad-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cad-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect native KiCad project
        id: detect
        shell: bash
        run: |
          if find hardware/kicad -maxdepth 1 -type f \( -name '*.kicad_sch' -o -name '*.kicad_pcb' \) 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject graphical-only schematic drafts
        if: steps.detect.outputs.present == 'true'
        run: python3 hardware/kicad/check_schematic_structure.py
      - name: Install KiCad 9 CLI
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends kicad
      - name: Run ERC, DRC and exports
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          kicad-cli version
          mkdir -p /tmp/schematic-preview /tmp/gerbers /tmp/drill /tmp/cad-reports
          while IFS= read -r -d '' file; do
            base="$(basename "$file" .kicad_sch)"
            echo "Running ERC: $file"
            kicad-cli sch erc --exit-code-violations --output "/tmp/cad-reports/$base-erc.rpt" "$file"
            kicad-cli sch export svg "$file" --output "/tmp/schematic-preview/"
          done < <(find hardware/kicad -maxdepth 1 -type f -name '*.kicad_sch' -print0)
          while IFS= read -r -d '' file; do
            base="$(basename "$file" .kicad_pcb)"
            echo "Running DRC: $file"
            kicad-cli pcb drc --exit-code-violations --output "/tmp/cad-reports/$base-drc.rpt" "$file"
            kicad-cli pcb export gerbers "$file" --output "/tmp/gerbers/"
            kicad-cli pcb export drill "$file" --output "/tmp/drill/"
          done < <(find hardware/kicad -maxdepth 1 -type f -name '*.kicad_pcb' -print0)
      - name: Upload CAD reports and exports
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kicad-validation-${{ github.run_id }}
          path: |
            /tmp/cad-reports/
            /tmp/schematic-preview/
            /tmp/gerbers/
            /tmp/drill/
          if-no-files-found: warn
      - name: Report CAD status
        if: steps.detect.outputs.present != 'true'
        run: echo "::warning::No native KiCad schematic/PCB files exist yet. Documentation and draft netlist are not manufacturing CAD."
