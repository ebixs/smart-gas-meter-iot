name: Hardware CAD checks

on:
  push:
    paths:
      - "hardware/kicad/**"
      - ".github/workflows/hardware-cad-check.yml"
  pull_request:
    paths:
      - "hardware/kicad/**"
      - ".github/workflows/hardware-cad-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cad-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect native KiCad project
        id: detect
        shell: bash
        run: |
          if find hardware/kicad -maxdepth 1 -type f \( -name '*.kicad_sch' -o -name '*.kicad_pcb' \) 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check native schematic structure
        if: steps.detect.outputs.present == 'true'
        run: python3 hardware/kicad/check_schematic_structure.py
      - name: Install KiCad 9 CLI
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends kicad
      - name: Run ERC, DRC and exports
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set +e
          set -uo pipefail
          echo "::notice title=KiCad version::$(kicad-cli version)"
          mkdir -p /tmp/schematic-preview /tmp/netlists /tmp/gerbers /tmp/drill /tmp/cad-reports
          failed=0
          # Report failures and report summaries as annotations so they are visible on the PR
          # (and through the checks API) without downloading logs or artifacts.
          fail() { echo "::error title=CAD check::$*"; failed=1; }
          check() {  # run a python check; on failure surface its first lines as annotations
            local title="$1"; shift
            local out; out="$("$@" 2>&1)"; local rc=$?
            echo "$out"
            if [ "$rc" -ne 0 ]; then
              echo "$out" | head -6 | while read -r line; do echo "::error title=$title::$line"; done
              failed=1
            fi
          }
          summarize() {
            grep -E "^\*\* Found|ERC messages|^\[[a-z_]+\]" "$2" 2>/dev/null | sed -E 's/\(.*//' | sort | uniq -c \
              | head -8 | while read -r line; do echo "::notice title=$1::$line"; done
          }
          while IFS= read -r -d '' file; do
            base="$(basename "$file" .kicad_sch)"
            echo "Running ERC: $file"
            kicad-cli sch erc --exit-code-violations --output "/tmp/cad-reports/$base-erc.rpt" "$file"
            rc=$?
            summarize "ERC $base" "/tmp/cad-reports/$base-erc.rpt"
            if [ "$rc" -eq 0 ]; then
              echo "ERC passed: $file"
            else
              fail "ERC failed (exit $rc): $file"
            fi
            kicad-cli sch export svg "$file" --output "/tmp/schematic-preview/"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              fail "Schematic SVG export failed (exit $rc): $file"
            fi
            kicad-cli sch export netlist "$file" --output "/tmp/netlists/$base.net"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              fail "Netlist export failed (exit $rc): $file"
            fi
          done < <(find hardware/kicad -maxdepth 1 -type f -name '*.kicad_sch' -print0)
          while IFS= read -r -d '' file; do
            base="$(basename "$file" .kicad_pcb)"
            echo "Running DRC: $file"
            kicad-cli pcb drc --schematic-parity --severity-all --exit-code-violations --output "/tmp/cad-reports/$base-drc.rpt" "$file"
            rc=$?
            summarize "DRC $base" "/tmp/cad-reports/$base-drc.rpt"
            if [ "$rc" -eq 0 ]; then
              echo "DRC passed: $file"
            else
              fail "DRC failed (exit $rc): $file"
            fi
            kicad-cli pcb export gerbers "$file" --output "/tmp/gerbers/"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              fail "Gerber export failed (exit $rc): $file"
            fi
            kicad-cli pcb export drill "$file" --output "/tmp/drill/"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              fail "Drill export failed (exit $rc): $file"
            fi
          done < <(find hardware/kicad -maxdepth 1 -type f -name '*.kicad_pcb' -print0)
          while IFS= read -r -d '' file; do
            echo "Checking exported netlist invariants: $file"
            check "Netlist invariants" python3 hardware/kicad/check_netlist_invariants.py "$file"
          done < <(find /tmp/netlists -maxdepth 1 -type f -name '*.net' -print0)
          if [ -f /tmp/netlists/smart_gas_meter_iot.net ]; then
            echo "Comparing exported netlist with design_v02.py"
            check "Netlist vs design" python3 hardware/kicad/check_netlist_matches_design.py /tmp/netlists/smart_gas_meter_iot.net
          fi
          check "Schematic sync" python3 hardware/kicad/tools/generate_schematic.py --check
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more CAD checks/exports/netlist invariants failed. Review uploaded reports; ERC/DRC violations are not suppressed."
            exit 1
          fi
      - name: Upload CAD reports and exports
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kicad-validation-${{ github.run_id }}
          path: |
            /tmp/cad-reports/
            /tmp/schematic-preview/
            /tmp/netlists/
            /tmp/gerbers/
            /tmp/drill/
          if-no-files-found: warn
      - name: Report CAD status
        if: steps.detect.outputs.present != 'true'
        run: echo "::warning::No native KiCad schematic/PCB files exist yet. Documentation and draft netlist are not manufacturing CAD."
