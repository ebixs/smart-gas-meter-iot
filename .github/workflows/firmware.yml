name: Firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", "schemas/**", "hardware/kicad/design_v02.py", ".github/workflows/firmware.yml"]
  pull_request:
    branches: [main]
    paths: ["firmware/**", "schemas/**", "hardware/kicad/design_v02.py", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Core logic on the host (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C unit tests
        run: |
          cmake -S firmware/test/host -B build/host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host -j
          ctest --test-dir build/host --output-on-failure
      - name: Demo records pass telemetry contract v2
        run: |
          build/host/sgm_host demo > /tmp/demo.jsonl
          python3 simulator/validate_telemetry.py /tmp/demo.jsonl

  esp32s3:
    name: ESP32-S3 build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [wifi, cell]
    steps:
      - uses: actions/checkout@v4
      - name: Build with ESP-IDF v5.3.2
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: firmware
          command: >-
            idf.py -B build-${{ matrix.variant }} -DSDKCONFIG=build-${{ matrix.variant }}/sdkconfig
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults${{ matrix.variant == 'cell' && ';sdkconfig.cell' || '' }}" build
      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3-${{ matrix.variant }}
          path: |
            firmware/build-${{ matrix.variant }}/smart_gas_meter.bin
            firmware/build-${{ matrix.variant }}/bootloader/bootloader.bin
            firmware/build-${{ matrix.variant }}/partition_table/partition-table.bin
            firmware/build-${{ matrix.variant }}/flasher_args.json
